<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل حسابدار</title>

<style>
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#111;
    color:#fff;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#d4af37;
    margin-bottom:25px;
}

.card{
    background:#1d1d1d;
    border-radius:15px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
}

.trade{
    background:#292929;
    border:1px solid #444;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
    line-height:2;
}

.amount{
    color:#d4af37;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:30px;
}

.error{
    color:#ff7777;
    text-align:center;
    padding:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>دفتر روزانه</h1>

<div class="card">

<div id="report" class="loading">
در حال دریافت اطلاعات...
</div>

</div>

</div>


<script>

const sheetURL = "https://script.google.com/macros/s/AKfycbzO-qbaGL7exKDRrRZQVTkniY4lC6wH0E38ri5Cp8OWwL3NKwXL0Xlad8_bdSSP3Pj7/exec";


function loadData(){

    fetch(sheetURL)

    .then(response => response.text())

    .then(text => {

        console.log("Google response:", text);

        const data = JSON.parse(text);

        const report = document.getElementById("report");

        if(!data || data.length <= 1){

            report.innerHTML = "اطلاعاتی ثبت نشده است.";

            return;
        }

        report.innerHTML = "";

        // ردیف اول عنوان ستون‌هاست
        for(let i = 1; i < data.length; i++){

            const item = data[i];

            report.innerHTML += `

                <div class="trade">

                    <div>
                        👤 <strong>ثبت کننده:</strong>
                        ${item[3] || ""}
                    </div>

                    <div>
                        📌 <strong>عملیات:</strong>
                        ${item[4] || ""}
                    </div>

                    <div>
                        📝 <strong>شرح:</strong>
                        ${item[5] || ""}
                    </div>

                    <div>
                        💰 <strong>مبلغ:</strong>
                        <span class="amount">
                        ${item[6] ? Number(item[6]).toLocaleString("fa-IR") : "—"}
                        </span>
                        تومان
                    </div>

                    <div>
                        📊 <strong>مظنه:</strong>
                        ${item[7] || "—"}
                    </div>

                    <div>
                        📅 <strong>تاریخ:</strong>
                        ${item[1] || ""}
                    </div>

                    <div>
                        ⏰ <strong>ساعت:</strong>
                        ${item[2] || ""}
                    </div>

                </div>

            `;
        }

    })

    .catch(error => {

        console.error("خطا:", error);

        document.getElementById("report").innerHTML =
        '<div class="error">خطا در دریافت اطلاعات</div>';

    });

}


loadData();

</script>

</body>

</html>
